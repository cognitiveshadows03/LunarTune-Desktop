name: Verify Desktop Sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Compose Multiplatform sources
        run: ./gradlew :desktop:compileKotlinDesktop --no-daemon
      - name: Run shared + desktop tests
        run: ./gradlew :desktop:desktopTest --no-daemon
