name: Release Desktop Pre-release

# Publishes Windows (x64 + arm64) and Linux (x64) desktop builds as a single
# GitHub pre-release. Triggers on version tags (v*) and on manual dispatch.
# macOS is intentionally out of scope for now; see desktop-macos.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            java_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            java_arch: aarch64
    runs-on: ${{ matrix.runner }}
    name: Windows ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java_arch }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Build installers and app image
        run: .\gradlew.bat :desktop:packageExe :desktop:packageMsi :desktop:createDistributable -PlunarTuneArch=${{ matrix.arch }} --no-daemon

      - name: Name installers with architecture
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe" | Select-Object -First 1
          if ($exe) { Move-Item $exe.FullName "desktop/build/compose/binaries/main/exe/LunarTune-5.2.0-${{ matrix.arch }}.exe" -Force }
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi.FullName "desktop/build/compose/binaries/main/msi/LunarTune-5.2.0-${{ matrix.arch }}.msi" -Force }

      - name: Strip and UPX-compress DLLs (portable only)
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appRoot) { Write-Host "No app image found, skipping"; exit 0 }
          $before = (Get-ChildItem $appRoot.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $strip = "C:\Program Files\Git\usr\bin\strip.exe"
          if (Test-Path $strip) {
            Get-ChildItem $appRoot.FullName -Recurse -Filter "*.dll" | ForEach-Object {
              & $strip --strip-unneeded $_.FullName 2>$null
            }
          }
          $upxUrl = "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip"
          try {
            Invoke-WebRequest -Uri $upxUrl -OutFile "upx.zip" -ErrorAction Stop
            Expand-Archive "upx.zip" -DestinationPath "upx" -Force
            $upx = Get-ChildItem "upx" -Recurse -Filter "upx.exe" | Select-Object -First 1
            if ($upx) {
              Get-ChildItem $appRoot.FullName -Recurse -Filter "*.dll" | ForEach-Object {
                & $upx.FullName --best --lzma $_.FullName 2>$null
              }
            }
          } catch { Write-Host "UPX download failed, skipping" }
          $after = (Get-ChildItem $appRoot.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "App image: $([math]::Round($before/1MB,1)) MB -> $([math]::Round($after/1MB,1)) MB (strip + UPX)"

      - name: Zip portable build (max compression)
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appRoot) { throw "No app image to zip" }
          $zip = "desktop/build/compose/binaries/main/LunarTune-5.2.0-${{ matrix.arch }}-portable.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path $appRoot.FullName -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Portable zip was not created" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/*-portable.zip
          if-no-files-found: error

  build-linux:
    # The .deb's libc6 dependency is lowered to 2.17 in post-processing,
    # making it installable on Ubuntu 17.10+ regardless of the build runner.
    runs-on: ubuntu-latest
    name: Linux x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        run: ./gradlew :desktop:createDistributable -PlunarTuneArch=x64 --no-daemon

      - name: Shrink app image (filter natives + strip + UPX)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$app_root" ]; then echo "No app image found"; exit 1; fi
          before=$(du -sh "$app_root" | cut -f1)
          natives_jar=$(find "$(pwd)/$app_root" -name "lavaplayer-natives-*.jar" | head -1)
          if [ -n "$natives_jar" ]; then
            tmp=$(mktemp -d)
            (cd "$tmp" && unzip -q "$natives_jar")
            find "$tmp" -type f \( -name "*.dll" -o -name "*.dylib" \) -delete 2>/dev/null || true
            find "$tmp" -type d -name "aarch64" -exec rm -rf {} + 2>/dev/null || true
            find "$tmp" -type d -name "arm" -exec rm -rf {} + 2>/dev/null || true
            find "$tmp" -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
            sudo apt-get install -y upx-ucl 2>/dev/null || true
            if command -v upx &>/dev/null; then
              find "$tmp" -type f -name "*.so" -size +50k -exec upx --best --lzma {} \; 2>&1 || true
            fi
            rm -f "$natives_jar"
            (cd "$tmp" && zip -q -r "$natives_jar" . )
            rm -rf "$tmp"
          fi
          find "$app_root" -type f -name "*.so" -exec strip --strip-all {} \; 2>/dev/null || true
          find "$app_root" -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          if command -v upx &>/dev/null; then
            find "$app_root" -type f -name "*.so" -size +100k -exec upx --best --lzma {} \; 2>&1 || true
          fi
          after=$(du -sh "$app_root" | cut -f1)
          echo "App image: $before -> $after (filter natives + strip + UPX)"

      - name: Build deb from shrunk image
        run: ./gradlew :desktop:packageDeb -PlunarTuneArch=x64 --no-daemon

      - name: Build portable tarball (xz -9e)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          base=$(basename "$app_root")
          tar -cf - -C "$(dirname "$app_root")" "$base" | xz -9e > "desktop/build/compose/binaries/main/LunarTune-5.2.0-x64-portable.tar.xz"

      # Lower libc6/libstdc++6 deps so the .deb installs on Ubuntu 17.10+,
      # and recompress data.tar from zstd to xz for smaller size.
      - name: Fix deb deps for old distros + recompress with xz
        run: |
          deb=$(find "$(pwd)/desktop/build/compose/binaries/main/deb" -name "*.deb" | head -n1)
          if [ -z "$deb" ]; then echo "No deb found"; exit 0; fi
          before=$(stat -c%s "$deb")
          tmp=$(mktemp -d)
          cp "$deb" "$tmp/orig.deb"
          (cd "$tmp" && ar x orig.deb)

          # Fix control file: lower glibc/libstdc++ deps for old distros.
          for ext in zst gz xz; do
            if [ -f "$tmp/control.tar.$ext" ]; then
              case $ext in
                zst) zstd -d "$tmp/control.tar.$ext" -o "$tmp/control.tar" ;;
                gz)  zcat "$tmp/control.tar.$ext" > "$tmp/control.tar" ;;
                xz)  xz -d -c "$tmp/control.tar.$ext" > "$tmp/control.tar" ;;
              esac
              rm "$tmp/control.tar.$ext"
              break
            fi
          done
          if [ -f "$tmp/control.tar" ]; then
            mkdir -p "$tmp/control_dir"
            (cd "$tmp/control_dir" && tar xf "$tmp/control.tar")
            # Strip 't64' suffix from package names (Ubuntu 24.04 time64 transition).
            sed -i -E 's/([a-z0-9.+-]+)t64\b/\1/g' "$tmp/control_dir/control"
            sed -i -E 's/libc6 \(>= [0-9.]+\)/libc6 (>= 2.17)/' "$tmp/control_dir/control"
            sed -i -E 's/libstdc\+\+6 \(>= [^)]+\)/libstdc++6 (>= 3.4.21)/' "$tmp/control_dir/control"
            (cd "$tmp/control_dir" && tar cf "$tmp/control.tar.new" .)
            xz -9e "$tmp/control.tar.new"
            rm "$tmp/control.tar"
          fi

          # Recompress data.tar from zstd/gzip to xz.
          if [ -f "$tmp/data.tar.zst" ]; then
            zstd -d "$tmp/data.tar.zst" -o "$tmp/data.tar"
            rm "$tmp/data.tar.zst"
          elif [ -f "$tmp/data.tar.gz" ]; then
            zcat "$tmp/data.tar.gz" > "$tmp/data.tar"
            rm "$tmp/data.tar.gz"
          fi
          if [ -f "$tmp/data.tar" ]; then
            xz -9e "$tmp/data.tar"
          fi

          # Reassemble.
          ctrl_arg="$(ls "$tmp"/control.tar.* 2>/dev/null | head -1)"
          data_arg="$(ls "$tmp"/data.tar.* 2>/dev/null | head -1)"
          (cd "$tmp" && ar rcs new.deb debian-binary "$ctrl_arg" "$data_arg")
          if [ -f "$tmp/new.deb" ]; then
            cp "$tmp/new.deb" "$deb"
            after=$(stat -c%s "$deb")
            echo "Deb: $((before/1024/1024))M -> $((after/1024/1024))M (deps fixed + recompressed)"
          fi
          rm -rf "$tmp"
          mv "$deb" "desktop/build/compose/binaries/main/deb/LunarTune-5.2.0-x64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/*-portable.tar.*
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    name: Publish pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect release assets
        run: find release-assets -type f -exec ls -lh {} \;

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: LunarTune Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.zip
            release-assets/**/*.deb
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.xz
