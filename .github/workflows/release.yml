name: Release Desktop Pre-release

# Publishes Windows (x64 + arm64) and Linux (x64) desktop builds as a single
# GitHub pre-release. Triggers on version tags (v*) and on manual dispatch.
# macOS is intentionally out of scope for now; see desktop-macos.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            java_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            java_arch: aarch64
    runs-on: ${{ matrix.runner }}
    name: Windows ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java_arch }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        run: .\gradlew.bat :desktop:createDistributable -PlunarTuneArch=${{ matrix.arch }} --no-daemon

      - name: Re-jlink runtime with compression
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          $runtimeDir = Join-Path $appRoot.FullName "runtime"
          if (-not (Test-Path $runtimeDir)) { Write-Host "No runtime dir, skipping"; exit 0 }
          $releaseFile = Join-Path $runtimeDir "release"
          if (-not (Test-Path $releaseFile)) { Write-Host "No release file, skipping"; exit 0 }
          $modulesLine = (Get-Content $releaseFile | Where-Object { $_ -match '^MODULES=' })
          $modules = $modulesLine -replace '^MODULES=', '' -replace '"', ''
          $jlink = Join-Path $env:JAVA_HOME "bin\jlink.exe"
          $newDir = "$runtimeDir.compressed"
          & $jlink --compress=2 --strip-debug --no-header-files --no-man-pages `
            --module-path (Join-Path $env:JAVA_HOME "jmods") `
            --add-modules $modules `
            --output $newDir 2>&1
          if ($LASTEXITCODE -eq 0 -and (Test-Path $newDir)) {
            Remove-Item $runtimeDir -Recurse -Force
            Rename-Item $newDir $runtimeDir
            Write-Host "Re-jlinked runtime with --compress=2"
          } else {
            Write-Host "Re-jlink failed, keeping original runtime"
            if (Test-Path $newDir) { Remove-Item $newDir -Recurse -Force }
          }

      - name: Build installers from compressed image
        run: .\gradlew.bat :desktop:packageExe :desktop:packageMsi -PlunarTuneArch=${{ matrix.arch }} --no-daemon

      - name: Name installers with architecture
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe" | Select-Object -First 1
          if ($exe) { Move-Item $exe.FullName "desktop/build/compose/binaries/main/exe/LunarTune-5.2.0-${{ matrix.arch }}.exe" -Force }
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi.FullName "desktop/build/compose/binaries/main/msi/LunarTune-5.2.0-${{ matrix.arch }}.msi" -Force }

      - name: Strip debug symbols from bundled DLLs (portable only)
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appRoot) { Write-Host "No app image found, skipping strip"; exit 0 }
          $strip = "C:\Program Files\Git\usr\bin\strip.exe"
          if (-not (Test-Path $strip)) { Write-Host "strip.exe not found, skipping"; exit 0 }
          Get-ChildItem $appRoot.FullName -Recurse -Filter "*.dll" | ForEach-Object {
            & $strip --strip-unneeded $_.FullName 2>$null
          }

      - name: Zip portable build (max compression)
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appRoot) { throw "No app image to zip" }
          $zip = "desktop/build/compose/binaries/main/LunarTune-5.2.0-${{ matrix.arch }}-portable.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path $appRoot.FullName -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Portable zip was not created" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/*-portable.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    name: Linux x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        run: ./gradlew :desktop:createDistributable -PlunarTuneArch=x64 --no-daemon

      - name: Re-jlink runtime with compression
        run: |
          runtime_dir=$(find desktop/build/compose/binaries/main/app -type d -name "runtime" | head -1)
          if [ -z "$runtime_dir" ]; then echo "No runtime dir found, skipping"; exit 0; fi
          modules=$(grep "^MODULES=" "$runtime_dir/release" | sed 's/^MODULES=//' | tr -d '"')
          new_dir="${runtime_dir}.compressed"
          "$JAVA_HOME/bin/jlink" \
            --compress=2 --strip-debug --no-header-files --no-man-pages \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules "$modules" \
            --output "$new_dir" 2>&1
          if [ $? -eq 0 ] && [ -d "$new_dir" ]; then
            rm -rf "$runtime_dir"
            mv "$new_dir" "$runtime_dir"
            echo "Re-jlinked runtime with --compress=2"
          else
            echo "Re-jlink failed, keeping original runtime"
            rm -rf "$new_dir"
          fi

      - name: Strip debug symbols from native libraries
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          find "$app_root" -type f -name "*.so" -exec strip --strip-all {} \; 2>/dev/null || true
          find "$app_root" -type f -name "*.debuginfo" -delete 2>/dev/null || true

      - name: Build deb installer from compressed image
        run: ./gradlew :desktop:packageDeb -PlunarTuneArch=x64 --no-daemon

      - name: Build portable tarball (xz -9e)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          base=$(basename "$app_root")
          tar -cf - -C "$(dirname "$app_root")" "$base" | xz -9e > "desktop/build/compose/binaries/main/LunarTune-5.2.0-x64-portable.tar.xz"
          deb=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n1)
          if [ -n "$deb" ]; then mv "$deb" "desktop/build/compose/binaries/main/deb/LunarTune-5.2.0-x64.deb"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/*-portable.tar.*
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    name: Publish pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect release assets
        run: find release-assets -type f -exec ls -lh {} \;

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: LunarTune Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.zip
            release-assets/**/*.deb
            release-assets/**/*.tar.gz
            release-assets/**/*.tar.xz
