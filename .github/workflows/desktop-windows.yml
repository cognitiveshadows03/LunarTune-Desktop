name: Build Windows Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            java_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            java_arch: aarch64
    runs-on: ${{ matrix.runner }}
    name: Windows ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java_arch }}
      - uses: gradle/actions/setup-gradle@v4

      # Build the app image first, then re-jlink the runtime with --compress=2
      # before building the installers. This way .exe, .msi and portable zip all
      # benefit from the compressed runtime (typically 25-30% smaller).
      - name: Build app image
        run: .\gradlew.bat :desktop:createDistributable -PlunarTuneArch=${{ matrix.arch }} --no-daemon

      - name: Re-jlink runtime with compression
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          $runtimeDir = Join-Path $appRoot.FullName "runtime"
          if (-not (Test-Path $runtimeDir)) { Write-Host "No runtime dir, skipping"; exit 0 }
          $releaseFile = Join-Path $runtimeDir "release"
          if (-not (Test-Path $releaseFile)) { Write-Host "No release file, skipping"; exit 0 }
          $modulesLine = (Get-Content $releaseFile | Where-Object { $_ -match '^MODULES=' })
          $modules = $modulesLine -replace '^MODULES=', '' -replace '"', ''
          Write-Host "Modules: $modules"
          $jlink = Join-Path $env:JAVA_HOME "bin\jlink.exe"
          $newDir = "$runtimeDir.compressed"
          $before = (Get-ChildItem $runtimeDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          & $jlink --compress=2 --strip-debug --no-header-files --no-man-pages `
            --module-path (Join-Path $env:JAVA_HOME "jmods") `
            --add-modules $modules `
            --output $newDir 2>&1
          if ($LASTEXITCODE -eq 0 -and (Test-Path $newDir)) {
            Remove-Item $runtimeDir -Recurse -Force
            Rename-Item $newDir $runtimeDir
            $after = (Get-ChildItem $runtimeDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host "Runtime: $([math]::Round($before/1MB,1)) MB -> $([math]::Round($after/1MB,1)) MB (with --compress=2)"
          } else {
            Write-Host "Re-jlink failed, keeping original runtime"
            if (Test-Path $newDir) { Remove-Item $newDir -Recurse -Force }
          }

      - name: Build installers from compressed image
        run: .\gradlew.bat :desktop:packageExe :desktop:packageMsi -PlunarTuneArch=${{ matrix.arch }} --no-daemon

      # A green build says nothing about the packaged jlink runtime: jpackage's
      # native launcher is the only thing that reports "Failed to launch JVM".
      # The app's --launch-check path loads representative classes from the JDK
      # modules the UI needs, writes a marker and exits without opening a window.
      - name: Verify the packaged runtime launches
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory -ErrorAction Stop | Select-Object -First 1
          if (-not $appRoot) { throw "createDistributable produced no app image" }
          $exe = Get-ChildItem $appRoot.FullName -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No launcher inside $($appRoot.FullName)" }
          $marker = Join-Path (Get-Location) "launch-check.txt"
          $out = Join-Path $env:RUNNER_TEMP "lunartune-launch-check.out"
          $err = Join-Path $env:RUNNER_TEMP "lunartune-launch-check.err"
          Remove-Item $marker -ErrorAction SilentlyContinue
          $arg = '--launch-check="' + $marker + '"'
          Write-Host "Running $($exe.FullName) $arg"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList $arg -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden
          if (-not $p.WaitForExit(90000)) {
            $p.Kill()
            throw "Packaged launcher did not finish the launch check within 90s"
          }
          Write-Host "exit=$($p.ExitCode)"
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Packaged launcher exited with $($p.ExitCode)" }
          if (-not (Test-Path $marker)) { throw "Launch check marker missing: the JVM never reached main()" }
          $report = Get-Content $marker -Raw
          Write-Host "Launch check: $report"
          if ($report -match 'missing=') { throw "Packaged runtime is missing JDK modules: $report" }
          if ($report -notlike 'LUNARTUNE_LAUNCH_CHECK_OK*') { throw "Unexpected launch check report: $report" }
          Remove-Item $marker -ErrorAction SilentlyContinue

      - name: Name installers with architecture
        shell: pwsh
        run: |
          $exe = Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe" | Select-Object -First 1
          if ($exe) { Move-Item $exe.FullName "desktop/build/compose/binaries/main/exe/LunarTune-5.2.0-${{ matrix.arch }}.exe" -Force }
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if ($msi) { Move-Item $msi.FullName "desktop/build/compose/binaries/main/msi/LunarTune-5.2.0-${{ matrix.arch }}.msi" -Force }

      # The .exe and .msi installers are built by jpackage from the app image
      # in the gradle invocation above, so they already benefit from the curated
      # jlink module list. The portable zip is built from the same app image
      # below; we strip debug symbols from the bundled DLLs first to shave a few
      # more MB off the archive. strip.exe ships with Git for Windows (MSYS2).
      - name: Strip debug symbols from bundled runtime (portable only)
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appRoot) { Write-Host "No app image found, skipping strip"; exit 0 }
          $strip = "C:\Program Files\Git\usr\bin\strip.exe"
          if (-not (Test-Path $strip)) { Write-Host "strip.exe not found, skipping"; exit 0 }
          $before = (Get-ChildItem $appRoot.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Get-ChildItem $appRoot.FullName -Recurse -Filter "*.dll" | ForEach-Object {
            & $strip --strip-unneeded $_.FullName 2>$null
          }
          $after = (Get-ChildItem $appRoot.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "App image: $([math]::Round($before/1MB,1)) MB -> $([math]::Round($after/1MB,1)) MB"

      - name: Zip portable build (max compression)
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appRoot) { throw "No app image to zip" }
          $zip = "desktop/build/compose/binaries/main/LunarTune-5.2.0-${{ matrix.arch }}-portable.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          # Compress-Archive at Optimal level beats bsdtar's default deflate by a
          # few percent on the bundled runtime, which is the bulk of the archive.
          Compress-Archive -Path $appRoot.FullName -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Portable zip was not created" }

      - name: Report installer sizes
        shell: pwsh
        run: |
          Get-ChildItem "desktop/build/compose/binaries/main/exe/*.exe","desktop/build/compose/binaries/main/msi/*.msi","desktop/build/compose/binaries/main/*.zip" |
            Select-Object Name, @{Name="MB";Expression={[math]::Round($_.Length/1MB,1)}} | Format-Table

      # EXE and MSI are separate downloads, and each architecture is separate.
      # The portable zip is a third, installer-free option for each architecture.
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-windows-${{ matrix.arch }}-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-windows-${{ matrix.arch }}-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-windows-${{ matrix.arch }}-portable
          path: desktop/build/compose/binaries/main/*-portable.zip
          if-no-files-found: error
