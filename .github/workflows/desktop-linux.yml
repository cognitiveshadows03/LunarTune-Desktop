name: Build Linux Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

jobs:
  linux:
    # The bundled binaries (JDK, lavaplayer, skiko) are all pre-built and only
    # require glibc 2.17+, so the build runner's glibc doesn't affect output
    # compatibility. The .deb's declared libc6 dependency is lowered to 2.17
    # in the post-processing step below, making it installable on Ubuntu 17.10+.
    runs-on: ubuntu-latest
    name: Linux x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        run: ./gradlew :desktop:createDistributable -PlunarTuneArch=x64 --no-daemon

      # Shrink the app image: filter the lavaplayer-natives jar to Linux x64
      # only (it ships natives for every platform — 26M → ~8M), strip .so debug
      # symbols, and UPX-compress the large application .so files (skiko,
      # lavaplayer). The JDK runtime's .so files (libjvm.so, libjava.so, etc.)
      # are NEVER UPX-compressed — UPX-packing libjvm.so breaks dlopen-based JVM
      # loading and causes "Failed to load JVM" at launch.
      - name: Shrink app image (filter natives + strip + UPX)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$app_root" ]; then echo "No app image found"; exit 1; fi
          before=$(du -sh "$app_root" | cut -f1)

          # 1. Filter lavaplayer-natives jar to Linux x64 only.
          natives_jar=$(find "$(pwd)/$app_root" -name "lavaplayer-natives-*.jar" | head -1)
          if [ -n "$natives_jar" ]; then
            tmp=$(mktemp -d)
            (cd "$tmp" && unzip -q "$natives_jar")
            find "$tmp" -type f \( -name "*.dll" -o -name "*.dylib" \) -delete 2>/dev/null || true
            find "$tmp" -type d -name "aarch64" -exec rm -rf {} + 2>/dev/null || true
            find "$tmp" -type d -name "arm" -exec rm -rf {} + 2>/dev/null || true
            find "$tmp" -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
            sudo apt-get install -y upx-ucl 2>/dev/null || true
            if command -v upx &>/dev/null; then
              find "$tmp" -type f -name "*.so" -size +50k -exec upx --best --lzma {} \; 2>&1 || true
            fi
            rm -f "$natives_jar"
            (cd "$tmp" && zip -q -r "$natives_jar" . )
            rm -rf "$tmp"
          fi

          # 2. Strip debug symbols from all .so in the app image (safe for both
          #    runtime and app .so files).
          find "$app_root" -type f -name "*.so" -exec strip --strip-all {} \; 2>/dev/null || true

          # 3. UPX-compress ONLY application .so files (skiko, lavaplayer).
          #    NEVER UPX the JDK runtime's .so files (libjvm.so, libjava.so,
          #    libnet.so, etc.) — UPX-packing libjvm.so breaks the JVM's
          #    dlopen-based loading and causes "Failed to load JVM".
          app_lib_dir="$app_root/lib/app"
          if [ -d "$app_lib_dir" ]; then
            find "$app_lib_dir" -type f -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
            if command -v upx &>/dev/null; then
              find "$app_lib_dir" -type f -name "*.so" -size +100k -exec upx --best --lzma {} \; 2>&1 || true
            fi
          fi

          after=$(du -sh "$app_root" | cut -f1)
          echo "App image: $before -> $after (filter natives + strip + UPX app-only)"

      # Verify the packaged runtime launches. The app's --launch-check path
      # loads representative classes from the JDK modules the UI needs, writes a
      # marker and exits without opening a window. This catches a broken jlink
      # runtime before it ships — the same check the Windows build runs.
      - name: Verify the packaged runtime launches
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$app_root" ]; then echo "No app image found"; exit 1; fi
          launcher=$(find "$app_root/bin" -type f -name "LunarTune" | head -n1)
          if [ -z "$launcher" ]; then echo "No launcher found"; exit 1; fi
          chmod +x "$launcher"
          marker="$(pwd)/launch-check.txt"
          rm -f "$marker"
          "$launcher" "--launch-check=$marker" 2>&1 || true
          if [ ! -f "$marker" ]; then
            echo "ERROR: Launch check marker missing — the JVM never reached main()"
            exit 1
          fi
          report=$(cat "$marker")
          echo "Launch check: $report"
          if echo "$report" | grep -q "missing="; then
            echo "ERROR: Packaged runtime is missing JDK modules: $report"
            exit 1
          fi
          if ! echo "$report" | grep -q "LUNARTUNE_LAUNCH_CHECK_OK"; then
            echo "ERROR: Unexpected launch check report: $report"
            exit 1
          fi
          rm -f "$marker"

      - name: Build deb from shrunk image
        run: ./gradlew :desktop:packageDeb -PlunarTuneArch=x64 --no-daemon

      - name: Build portable tarball (xz -9e)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          base=$(basename "$app_root")
          out="desktop/build/compose/binaries/main/LunarTune-5.2.0-x64-portable.tar.xz"
          tar -cf - -C "$(dirname "$app_root")" "$base" | xz -9e > "$out"
          ls -lh "$out"

      # Finalize the .deb: (1) lower the libc6/libstdc++6 dependencies so the
      # package installs on Ubuntu 17.10+ (jpackage sets them from the build
      # runner's glibc, which is far higher than the actual requirement), and
      # (2) recompress data.tar from zstd to xz for ~15% smaller size.
      # The bundled binaries (Temurin JDK 21, lavaplayer, skiko) are all
      # pre-built and only require glibc 2.17+, so lowering the declared
      # dependency is safe and makes the .deb installable on old distros.
      - name: Fix deb deps for old distros + recompress with xz
        run: |
          deb=$(find "$(pwd)/desktop/build/compose/binaries/main/deb" -name "*.deb" | head -n1)
          if [ -z "$deb" ]; then echo "No deb found"; exit 0; fi
          echo "Deb: $deb"
          echo "=== Original deb contents ==="
          ar t "$deb"
          before=$(stat -c%s "$deb")
          tmp=$(mktemp -d)
          cp "$deb" "$tmp/orig.deb"
          (cd "$tmp" && ar x orig.deb)

          # --- Fix control file: lower glibc/libstdc++ deps for old distros ---
          control_orig=""
          for ext in zst gz xz; do
            if [ -f "$tmp/control.tar.$ext" ]; then
              control_orig="control.tar.$ext"
              case $ext in
                zst) zstd -d "$tmp/control.tar.$ext" -o "$tmp/control.tar" ;;
                gz)  zcat "$tmp/control.tar.$ext" > "$tmp/control.tar" ;;
                xz)  xz -d -c "$tmp/control.tar.$ext" > "$tmp/control.tar" ;;
              esac
              rm "$tmp/control.tar.$ext"
              break
            fi
          done

          if [ -n "$control_orig" ] && [ -f "$tmp/control.tar" ]; then
            mkdir -p "$tmp/control_dir"
            (cd "$tmp/control_dir" && tar xf "$tmp/control.tar")
            echo "=== Original control file ==="
            cat "$tmp/control_dir/control"
            # Strip the 't64' suffix from package names. Ubuntu 24.04 renamed
            # several packages (libasound2 → libasound2t64, libpng16-16 →
            # libpng16-16t64) as part of the time64 transition. The t64 names
            # don't exist on Ubuntu 17.10-22.04; the non-t64 names work on
            # both old and new Ubuntu (24.04 provides them as virtual packages).
            sed -i -E 's/([a-z0-9.+-]+)t64\b/\1/g' "$tmp/control_dir/control"
            # Lower libc6 version constraint if present (JDK 21 needs >= 2.17).
            sed -i -E 's/libc6 \(>= [0-9.]+\)/libc6 (>= 2.17)/' "$tmp/control_dir/control"
            # Lower libstdc++6 version constraint if present.
            sed -i -E 's/libstdc\+\+6 \(>= [^)]+\)/libstdc++6 (>= 3.4.21)/' "$tmp/control_dir/control"
            echo "=== Fixed control file ==="
            cat "$tmp/control_dir/control"
            (cd "$tmp/control_dir" && tar cf "$tmp/control.tar.new" .)
            xz -9e "$tmp/control.tar.new"
            rm "$tmp/control.tar"
          else
            echo "WARNING: No control.tar found, skipping dep fix"
          fi

          # --- Recompress data.tar from zstd/gzip to xz ---
          if [ -f "$tmp/data.tar.zst" ]; then
            zstd -d "$tmp/data.tar.zst" -o "$tmp/data.tar"
            rm "$tmp/data.tar.zst"
          elif [ -f "$tmp/data.tar.gz" ]; then
            zcat "$tmp/data.tar.gz" > "$tmp/data.tar"
            rm "$tmp/data.tar.gz"
          elif [ -f "$tmp/data.tar.xz" ]; then
            # Already xz — just need to reassemble with the fixed control.
            :
          fi
          if [ -f "$tmp/data.tar" ]; then
            xz -9e "$tmp/data.tar"
          fi

          # --- Reassemble the .deb ---
          # Use control.tar.new.xz (fixed deps) if available, else original.
          ctrl_arg=""
          if [ -f "$tmp/control.tar.new.xz" ]; then
            ctrl_arg="control.tar.new.xz"
          else
            ctrl_arg=$(ls "$tmp"/control.tar.* 2>/dev/null | head -1)
          fi
          data_arg=""
          if [ -f "$tmp/data.tar.xz" ]; then
            data_arg="data.tar.xz"
          else
            data_arg=$(ls "$tmp"/data.tar.* 2>/dev/null | head -1)
          fi
          (cd "$tmp" && ar rcs new.deb debian-binary "$ctrl_arg" "$data_arg")

          if [ -f "$tmp/new.deb" ]; then
            cp "$tmp/new.deb" "$deb"
            after=$(stat -c%s "$deb")
            echo "Deb: $((before/1024/1024))M -> $((after/1024/1024))M (deps fixed + recompressed)"
          else
            echo "ERROR: Failed to reassemble deb"
          fi
          rm -rf "$tmp"

      - name: Name deb with architecture
        run: |
          deb=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n1)
          if [ -n "$deb" ]; then mv "$deb" "desktop/build/compose/binaries/main/deb/LunarTune-5.2.0-x64.deb"; fi

      - name: Report artifact sizes
        run: |
          ls -lh desktop/build/compose/binaries/main/deb/*.deb desktop/build/compose/binaries/main/*.tar.* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-portable
          path: desktop/build/compose/binaries/main/*-portable.tar.*
          if-no-files-found: error
