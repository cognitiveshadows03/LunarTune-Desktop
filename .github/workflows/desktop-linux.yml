name: Build Linux Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app image and deb
        run: ./gradlew :desktop:createDistributable :desktop:packageDeb -PlunarTuneArch=x64 --no-daemon

      # Strip debug symbols from native libraries, then UPX-compress them.
      # UPX achieves 40-60% compression on .so files (Skiko, lavaplayer native
      # codecs) — the single biggest size win after the module curation.
      - name: Strip and UPX-compress native libraries
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$app_root" ]; then echo "No app image found"; exit 1; fi
          before=$(du -sh "$app_root" | cut -f1)
          # Strip debug symbols.
          find "$app_root" -type f -name "*.so" -exec strip --strip-all {} \; 2>/dev/null || true
          # Install and run UPX on every .so (some JDK .so files may be too large
          # or use ELF features UPX can't handle; errors are non-fatal).
          sudo apt-get install -y upx-ucl 2>/dev/null || true
          if command -v upx &>/dev/null; then
            find "$app_root" -type f -name "*.so" -size +100k -exec upx --best --lzma {} \; 2>&1 || true
          fi
          after=$(du -sh "$app_root" | cut -f1)
          echo "App image: $before -> $after (strip + UPX)"
          # Diagnostic: list the 20 largest files in the app image.
          echo "=== 20 largest files ==="
          find "$app_root" -type f -exec du -h {} + 2>/dev/null | sort -rh | head -20

      - name: Build portable tarball (xz -9e)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          base=$(basename "$app_root")
          out="desktop/build/compose/binaries/main/LunarTune-5.2.0-x64-portable.tar.xz"
          tar -cf - -C "$(dirname "$app_root")" "$base" | xz -9e > "$out"
          ls -lh "$out"

      # Recompress the .deb's data.tar from gzip to xz. dpkg has supported
      # data.tar.xz since Debian jessie; xz is ~15% smaller than gzip on JVM
      # runtimes.
      - name: Recompress deb with xz
        run: |
          deb=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n1)
          if [ -z "$deb" ]; then echo "No deb found"; exit 0; fi
          echo "=== Deb contents ==="
          ar t "$deb"
          before=$(du -h "$deb" | cut -f1)
          tmp=$(mktemp -d)
          cp "$deb" "$tmp/orig.deb"
          cd "$tmp"
          ar x orig.deb
          ls -lh
          # Handle both gzip and zst compression
          if [ -f data.tar.gz ]; then
            zcat data.tar.gz | xz -9e > data.tar.xz
            rm data.tar.gz
          elif [ -f data.tar.zst ]; then
            zstd -d data.tar.zst -o data.tar
            xz -9e data.tar
            rm data.tar.zst
          fi
          ar rcs new.deb debian-binary control.tar.* data.tar.xz 2>/dev/null || true
          if [ -f new.deb ] && [ $(stat -c%s new.deb) -lt $(stat -c%s orig.deb) ]; then
            cp new.deb "$deb"
            after=$(du -h "$deb" | cut -f1)
            echo "Deb: $before -> $after (recompressed with xz)"
          else
            echo "xz recompression didn't help, keeping original"
          fi
          rm -rf "$tmp"

      - name: Name deb with architecture
        run: |
          deb=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n1)
          if [ -n "$deb" ]; then mv "$deb" "desktop/build/compose/binaries/main/deb/LunarTune-5.2.0-x64.deb"; fi

      - name: Report artifact sizes
        run: |
          ls -lh desktop/build/compose/binaries/main/deb/*.deb desktop/build/compose/binaries/main/*.tar.* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-portable
          path: desktop/build/compose/binaries/main/*-portable.tar.*
          if-no-files-found: error
