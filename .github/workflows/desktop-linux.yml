name: Build Linux Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        run: ./gradlew :desktop:createDistributable -PlunarTuneArch=x64 --no-daemon

      # Re-jlink the bundled runtime with --strip-debug. Compose Multiplatform's
      # jlink invocation doesn't pass --strip-debug, so class-file debug info ships
      # in the runtime. We rebuild from the same module list (read from the release
      # file) with --strip-debug, which typically cuts 15-20% off the runtime
      # without conflicting with the archive compression (xz/gzip/zip compress the
      # stripped image better than a pre-compressed --compress=2 image).
      - name: Re-jlink runtime with --strip-debug
        run: |
          runtime_dir=$(find desktop/build/compose/binaries/main/app -type d -name "runtime" | head -1)
          if [ -z "$runtime_dir" ]; then echo "No runtime dir found, skipping"; exit 0; fi
          modules=$(grep "^MODULES=" "$runtime_dir/release" | sed 's/^MODULES=//' | tr -d '"' | tr ' ' ',')
          echo "Modules: $modules"
          new_dir="${runtime_dir}.stripped"
          before=$(du -sh "$runtime_dir" | cut -f1)
          "$JAVA_HOME/bin/jlink" \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules "$modules" \
            --output "$new_dir" 2>&1
          if [ $? -eq 0 ] && [ -d "$new_dir" ]; then
            rm -rf "$runtime_dir"
            mv "$new_dir" "$runtime_dir"
            after=$(du -sh "$runtime_dir" | cut -f1)
            echo "Runtime: $before -> $after (with --strip-debug)"
          else
            echo "Re-jlink failed, keeping original runtime"
            rm -rf "$new_dir"
          fi

      - name: Strip debug symbols from native libraries
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$app_root" ]; then echo "No app image found"; exit 1; fi
          before=$(du -sh "$app_root" | cut -f1)
          find "$app_root" -type f -name "*.so" -exec strip --strip-all {} \; 2>/dev/null || true
          find "$app_root" -type f -name "*.debuginfo" -delete 2>/dev/null || true
          after=$(du -sh "$app_root" | cut -f1)
          echo "App image: $before -> $after (after strip)"

      - name: Build deb installer from compressed image
        run: ./gradlew :desktop:packageDeb -PlunarTuneArch=x64 --no-daemon

      - name: Build portable tarball (xz -9e)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          base=$(basename "$app_root")
          out="desktop/build/compose/binaries/main/LunarTune-5.2.0-x64-portable.tar.xz"
          # xz -9e (extreme) squeezes the JVM runtime harder than tar's default -J (level 6).
          tar -cf - -C "$(dirname "$app_root")" "$base" | xz -9e > "$out"
          ls -lh "$out"

      - name: Name deb with architecture
        run: |
          deb=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n1)
          if [ -n "$deb" ]; then mv "$deb" "desktop/build/compose/binaries/main/deb/LunarTune-5.2.0-x64.deb"; fi

      - name: Report artifact sizes
        run: |
          ls -lh desktop/build/compose/binaries/main/deb/*.deb desktop/build/compose/binaries/main/*.tar.* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-portable
          path: desktop/build/compose/binaries/main/*-portable.tar.*
          if-no-files-found: error
