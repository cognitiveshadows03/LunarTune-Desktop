name: Build Linux Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "core/**"
      - "lyrics/**"
      - "morideobfuscator/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/desktop-linux.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux x64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Build the app image first, then strip debug symbols from every .so in
      # the bundled runtime, then build the .deb from the stripped image. This
      # way both the portable tarball and the .deb benefit from the strip pass.
      # We split the gradle invocations so the strip runs between createDistributable
      # and packageDeb; gradle sees createDistributable's inputs unchanged and
      # skips re-running it, so the stripped image survives into the .deb.
      - name: Build app image
        run: ./gradlew :desktop:createDistributable -PlunarTuneArch=x64 --no-daemon

      - name: Strip debug symbols from the bundled runtime
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$app_root" ]; then echo "No app image found"; exit 1; fi
          echo "App image: $app_root"
          before=$(du -sh "$app_root" | cut -f1)
          find "$app_root" -type f -name "*.so" -exec strip --strip-unneeded {} \; 2>/dev/null || true
          # Also remove the JDK's bundled debug symbols if present (.debuginfo files).
          find "$app_root" -type f -name "*.debuginfo" -delete 2>/dev/null || true
          after=$(du -sh "$app_root" | cut -f1)
          echo "App image: $before -> $after"

      - name: Build deb installer from stripped image
        run: ./gradlew :desktop:packageDeb -PlunarTuneArch=x64 --no-daemon

      - name: Build portable tarball (xz)
        run: |
          app_root=$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n1)
          base=$(basename "$app_root")
          out="desktop/build/compose/binaries/main/LunarTune-5.2.0-x64-portable.tar.xz"
          # xz compression is ~30% smaller than gzip on JVM runtimes.
          tar -C "$(dirname "$app_root")" -cJf "$out" "$base"
          ls -lh "$out"

      - name: Name deb with architecture
        run: |
          deb=$(find desktop/build/compose/binaries/main/deb -name "*.deb" | head -n1)
          if [ -n "$deb" ]; then mv "$deb" "desktop/build/compose/binaries/main/deb/LunarTune-5.2.0-x64.deb"; fi

      - name: Report artifact sizes
        run: |
          ls -lh desktop/build/compose/binaries/main/deb/*.deb desktop/build/compose/binaries/main/*.tar.* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lunartune-linux-x64-portable
          path: desktop/build/compose/binaries/main/*-portable.tar.*
          if-no-files-found: error
